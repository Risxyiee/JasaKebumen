name = "jasakebumen"
main = ".open-next/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# NOTE: Jangan menaruh [build] hook di sini.
# `npx wrangler deploy` pada proyek OpenNext langsung mendelegasikan ke
# `opennextjs-cloudflare deploy` TANPA menjalankan [build] command,
# dan wrangler deploy di dalam delegasi justru akan menjalankan [build]
# lagi (build dobel). Build dilakukan lewat `bun run build` (package.json):
# `NEXT_PRIVATE_STANDALONE=true next build && opennextjs-cloudflare build -s`
# sehingga Build Command di dashboard tidak perlu diubah.

# Static assets produced by `opennextjs-cloudflare build`
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1

# Rate limiting binding Cloudflare (native, gratis, tanpa state di DB) —
# pembatas burst per-IP untuk semua endpoint POST publik + login admin.
# Plan Free: hanya 1 binding & period wajib 10 detik, jadi SATU konfigurasi
# dipakai semua bucket (kunci = "bucket:ip", lihat src/lib/rate-limit.ts).
# Jika binding tidak tersedia (dev lokal), lib-nya degrade terbuka.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 15, period = 10 }

# Kredensial TIDAK ditaruh di file ini (bisa terbaca publik lewat repo).
# Set sebagai SECRETS di dashboard Cloudflare:
#   Workers & Pages -> jasakebumen -> Settings -> Variables and Secrets
#   -> ADMIN_USERNAME  (type: Secret)
#   -> ADMIN_PASSWORD  (type: Secret, jangan pakai password lama yang sudah terekspos di git)
#   -> DATABASE_URL    (type: Secret)
#      Saat ini: Supabase (Postgres). Salin string "Session pooler" dari
#      Dashboard Supabase -> Connect, lalu tambahkan ?sslmode=require di akhir:
#        postgresql://postgres.<ref>:<PASSWORD>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#      (Host db.<ref>.supabase.co / Direct = IPv6-only + CA privat — tidak
#      cocok untuk Workers. Tabel & data referensi dibentuk otomatis oleh
#      db-bootstrap saat request pertama, tidak perlu prisma db push.)
#
# PENTING — TLS Supabase dari Workers: verifikasi sertifikat pada socket TLS
# Workers tidak bisa dimatikan, sedangkan sertifikat pooler Supabase memakai
# CA privat Supabase → koneksi terenkripsi langsung SELALU gagal
# ("Connection terminated unexpectedly"; terbukti diuji di workerd 2026-10-24).
# src/lib/db.ts otomatis memakai sslmode=disable untuk host Supabase (interim,
# tidak terenkripsi). Solusi terenkripsi penuh = Hyperdrive (tersedia di plan
# Free, 100 ribu query/hari):
#   1. Dashboard Cloudflare -> Storage & Databases -> Hyperdrive -> Create:
#      Name: jasakebumen-db
#      Connection string: postgresql://postgres.<ref>:<PASSWORD>@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
#   2. Kirim ID Hyperdrive-nya ke assistant → blok di bawah diisi + deploy.
#      (Binding WAJIB dideklarasikan di file ini — binding yang hanya dibuat
#      lewat dashboard akan dihapus saat deploy berikutnya dari git.)
# 3. Aplikasi otomatis pindah ke jalur terenkripsi begitu binding aktif
#    (src/lib/db.ts mem-baca env.HYPERDRIVE.connectionString tanpa sslmode).
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<ID-HYPERDRIVE>"
# localConnectionString = "postgresql://postgres:postgres@localhost:5432/postgres"
# OpenNext otomatis meneruskan secrets ke process.env saat runtime.
#
# Variabel OPSIONAL (fitur aktif otomatis begitu diset + redeploy;
# situs tetap berjalan normal tanpanya — semua lib degrade terbuka):
#   -> TURNSTILE_SITE_KEY         (type: Text)   widget anti-bot di /daftar & form ulasan
#   -> TURNSTILE_SECRET_KEY       (type: Secret) verifikasi server Turnstile
#   -> CLOUDFLARE_ANALYTICS_TOKEN (type: Text)   beacon Web Analytics (KPI pengunjung)
